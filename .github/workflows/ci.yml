name: CI

on:
  push:
    branches: ['*']
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # node:sqlite 需要 Node 22.5+；Node 22 上 vitest fork worker 偶发崩溃
          # （Worker exited unexpectedly，本地 Node 26 无此现象），改用 24 LTS 对齐。
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck renderer
        run: npx tsc -b

      - name: Typecheck electron
        run: npx tsc -p electron/tsconfig.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
